<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFA Verification — AWS CloudOps Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0e1a; color: #eef0f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .mfa-card { background: #141924; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { font-size: 20px; margin-bottom: 8px; }
        .subtitle { font-size: 13px; color: #8892a4; margin-bottom: 30px; }
        input[type="text"] { width: 100%; padding: 14px; background: #1a2030; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #eef0f5; font-size: 24px; text-align: center; letter-spacing: 8px; outline: none; margin-bottom: 20px; }
        input:focus { border-color: #10b981; }
        .btn { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #0d9668; }
        .flash { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; color: #f87171; }
        .back { display: inline-block; margin-top: 16px; font-size: 12px; color: #8892a4; text-decoration: none; }
        .back:hover { color: #eef0f5; }
    </style>
</head>
<body>
    <div class="mfa-card">
        <div class="icon">🔑</div>
        <h2>Two-Factor Authentication</h2>
        <p class="subtitle">Enter the 6-digit code from your Authenticator app</p>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
        {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="code" maxlength="6" pattern="[0-9]{6}" required autofocus placeholder="000000" autocomplete="off">
            <button type="submit" class="btn">Verify</button>
        </form>
        <a href="/logout" class="back">← Back to login</a>
    </div>
</body>
</html>
