<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AWS CloudOps Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0e1a; color: #eef0f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #141924; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { font-size: 22px; color: #10b981; }
        .logo p { font-size: 13px; color: #8892a4; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; color: #8892a4; margin-bottom: 6px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px 14px; background: #1a2030; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #eef0f5; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #10b981; }
        .btn { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #0d9668; }
        .flash { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; color: #f87171; }
        .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #4f5b6e; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <h1>AWS CloudOps Portal</h1>
            <p>Sign in to continue</p>
        </div>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
        {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autofocus placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
        <div class="footer">Protected by MFA | Contact admin for access</div>
    </div>
</body>
</html>
