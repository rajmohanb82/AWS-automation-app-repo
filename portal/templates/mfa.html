{% extends "base.html" %}
{% block title %}Authenticator code{% endblock %}
{% block page %}mfa{% endblock %}
{% block content %}
<section class="card wizard">
  <h1>Authenticator code</h1>
  <p class="lede">Enter the current 6-digit code for {{ user.username }}.</p>
  <form class="stack" method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
    <button type="submit">Verify</button>
  </form>
</section>
{% endblock %}
