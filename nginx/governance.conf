server {
    listen 8181;
    server_name _;

    # Auth check — validates session via the admin panel
    location = /auth-check {
        internal;
        proxy_pass http://127.0.0.1:5002/auth-validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Login page redirect
    location /login {
        proxy_pass http://127.0.0.1:5002/login;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location /mfa-verify {
        proxy_pass http://127.0.0.1:5002/mfa-verify;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location /mfa-setup {
        proxy_pass http://127.0.0.1:5002/mfa-setup;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location /logout {
        proxy_pass http://127.0.0.1:5002/logout;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # All other requests — check auth first, then proxy to governance app
    location / {
        auth_request /auth-check;
        error_page 401 = @login_redirect;

        proxy_pass http://127.0.0.1:8183;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login_redirect {
        return 302 /login;
    }
}
