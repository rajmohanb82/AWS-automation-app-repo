services:
  portal:
    build:
      context: ./portal
    image: operations-console
    ports:
      - "5080:5080"
    environment:
      HOST: 0.0.0.0
      PORT: "5080"
      PORTAL_DB: /app/data/portal.db
    volumes:
      - ./portal/data:/app/data
      - ${HOME}/.aws:/home/app/.aws:ro
    restart: unless-stopped
